name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # What the checks are written against. Raise these on purpose, so a new
  # compiler's lints never fail a change that has nothing to do with them.
  RUST_TOOLCHAIN: "1.98"
  NODE_VERSION: "26"

jobs:
  backend:
    name: Backend and API client
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      # No debug information: nothing here runs under a debugger, and leaving
      # it out shortens the build and shrinks the cache.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The same two connections as .env.example.
      DATABASE_URL: postgres://exchange_app:exchange_app@127.0.0.1:5432/yuppers
      MIGRATION_DATABASE_URL: postgres://exchange:exchange@127.0.0.1:5432/yuppers
    services:
      # The same database as docker-compose.yml. As the container's own user,
      # `exchange` is a superuser here, so it may create the throwaway
      # databases the API tests use.
      postgres:
        # Pinned by digest, the same in every job and in the backup job's
        # PostgreSQL tools, and updated by hand: Dependabot does not read the
        # workflows' images (README, "Dependencies").
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f # 17
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: yuppers
        ports:
          - 5432:5432
        # Over TCP, which answers only once initialization has finished.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U exchange -d yuppers"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      # For the API client generator, the last step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A service container starts before the checkout, so it cannot mount the
      # init script the way docker-compose.yml does.
      - name: Create the application role
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U exchange -d yuppers < docker/postgres-init.sql

      # Each check below runs even when an earlier one has failed, so one run
      # reports everything that is wrong.
      - name: Format
        if: ${{ !cancelled() }}
        working-directory: backend
        run: cargo fmt --check

      - name: Clippy
        if: ${{ !cancelled() }}
        working-directory: backend
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        working-directory: backend
        run: cargo test --locked --no-fail-fast

      # Here rather than in the TypeScript job because the generator runs the
      # service's `openapi` binary, which the tests have just built.
      - name: Generated API client is up to date
        if: ${{ !cancelled() }}
        run: |
          npm run gen:api
          if [ -n "$(git status --porcelain -- packages/api-client)" ]; then
            git diff -- packages/api-client
            echo "::error::packages/api-client does not match the service. Run 'npm run gen:api' and commit the result."
            exit 1
          fi

  typescript:
    name: TypeScript
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and wording check
        run: npm run typecheck

      - name: Lint the web app
        if: ${{ !cancelled() }}
        run: npm run lint -w @yuppers/web

      - name: Lint the mobile app
        if: ${{ !cancelled() }}
        run: npm run lint -w @yuppers/mobile -- --max-warnings 0

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build the web app
        id: build-web
        if: ${{ !cancelled() }}
        run: npm run build:web

      # Fails when the invitation page outgrows apps/web/budget.json; prints
      # what it loads, and the main app's size for information.
      - name: Invitation page size budget
        if: ${{ !cancelled() && steps.build-web.outcome == 'success' }}
        run: npm run budget -w @yuppers/web

  # The mobile app's native configuration, checked before anyone builds it:
  # Expo's own checks of the dependencies and the app config, and the iOS and
  # Android projects generated from that config (as an EAS build would) into
  # a directory that is thrown away. No Expo, Apple or Google account is
  # involved and nothing is built or signed.
  mobile-config:
    name: Mobile app config
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        working-directory: apps/mobile
        run: npx expo-doctor

      # A copy of the app beside the installed packages, so nothing generated
      # lands in the checkout. With a web origin on HTTPS, so the universal
      # and app links are generated too (app.config.ts).
      - name: Generate the native projects
        if: ${{ !cancelled() }}
        env:
          CI: "1"
          EXPO_PUBLIC_WEB_URL: https://yuppers.example
        run: |
          out="$RUNNER_TEMP/prebuild"
          mkdir -p "$out"
          rsync -a --exclude node_modules apps/mobile/ "$out/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$out/node_modules"
          cd "$out"
          npx expo prebuild --no-install --platform ios
          npx expo prebuild --no-install --platform android
          manifest=android/app/src/main/AndroidManifest.xml
          # What the config says, as the native projects have it.
          grep --quiet 'applinks:yuppers.example' ios/*/*.entitlements
          grep --quiet 'NSPrivacyAccessedAPICategoryFileTimestamp' ios/*/PrivacyInfo.xcprivacy
          grep --quiet 'android:autoVerify="true"' "$manifest"
          grep --quiet 'android:host="yuppers.example"' "$manifest"
          # Invitation links, and the exchange pages notification emails link to.
          grep --quiet 'android:pathPattern="/.\*/i"' "$manifest"
          grep --quiet 'android:pathPrefix="/exchanges/"' "$manifest"
          # Push notifications: the iOS entitlement, and the Android channel
          # the service names in each message.
          grep --quiet '<key>aps-environment</key>' ios/*/*.entitlements
          grep --quiet 'default_notification_channel_id" android:value="default"' "$manifest"
          for permission in READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE SYSTEM_ALERT_WINDOW VIBRATE RECEIVE_BOOT_COMPLETED; do
            grep --quiet "android.permission.$permission\" tools:node=\"remove\"" "$manifest" \
              || { echo "::error::$permission is not removed"; exit 1; }
          done
          # The development client's local network string is the only one, and
          # release builds strip it; anything else is a permission to explain.
          extra="$(grep --only-matching --no-filename 'NS[A-Za-z]*UsageDescription' ios/*/Info.plist | grep --invert-match '^NSLocalNetworkUsageDescription$' || true)"
          if [ -n "$extra" ]; then
            echo "::error::new iOS permission strings: $extra. Explain them in docs/mobile-release.md and update this check."
            exit 1
          fi

      - name: Discard the native projects
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/prebuild"

  # Builds the image the Dockerfile describes and runs the whole stack from
  # docker-compose.yml, as a deployment would: the database, the migrations,
  # the API serving the web app, and the worker. Its own job, beside the two
  # above, so a slow image build never holds up their results.
  container:
    name: Container image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Render Blueprint (render.yaml, docs/deploy-render.md) against the
      # JSON schema Render publishes for it. Reads the public schema only;
      # nothing here has a Render account.
      - name: Render Blueprint is valid
        run: pipx run check-jsonschema==0.38.2 --schemafile https://render.com/schema/render.yaml.json render.yaml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build says which commit it is and when it was made
      # (docs/operations.md, "What is deployed"); the smoke check reads it back.
      - name: Build time
        id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          # The name docker-compose.yml uses, so it runs this build.
          tags: yuppers:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: docker image inspect yuppers:local --format 'yuppers:local is {{.Size}} bytes'

      - name: Start the stack
        run: docker compose --profile full up --no-build --detach

      # The API answers once the migrations have run and it has started; the
      # web app's entry page comes from the build inside the image.
      - name: Smoke check
        env:
          COMMIT: ${{ github.sha }}
          BUILT_AT: ${{ steps.build-time.outputs.value }}
        run: |
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/healthz; then break; fi
            sleep 2
          done
          check() {
            local expected="$1"; shift
            local actual
            actual="$(curl --silent --output /dev/null --write-out "$@")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::expected $expected, got $actual for: $*"
              exit 1
            fi
          }
          check '204' '%{http_code}' http://127.0.0.1:8080/healthz
          check '204' '%{http_code}' http://127.0.0.1:8080/readyz
          check '200 text/html' '%{http_code} %{content_type}' http://127.0.0.1:8080/
          check '200 application/json' '%{http_code} %{content_type}' http://127.0.0.1:8080/v1/meta
          check '200 text/html' '%{http_code} %{content_type}' http://127.0.0.1:8080/exchanges/some-id
          check '404' '%{http_code}' http://127.0.0.1:8080/v1/nothing
          # No app named, so no app link files, and never the app's page in their place.
          check '404 application/json' '%{http_code} %{content_type}' http://127.0.0.1:8080/.well-known/apple-app-site-association
          check '404 application/json' '%{http_code} %{content_type}' http://127.0.0.1:8080/.well-known/assetlinks.json
          curl --silent --fail http://127.0.0.1:8080/es/i | grep --quiet 'lang="es"'
          curl --silent --fail http://127.0.0.1:8080/en/i | grep --quiet 'lang="en"'
          # The privacy policy and the terms, written into their pages in each language, for readers without scripts.
          curl --silent --fail http://127.0.0.1:8080/privacy | grep --quiet 'id="text-messages"'
          curl --silent --fail http://127.0.0.1:8080/es/privacy | grep --quiet 'lang="es"'
          curl --silent --fail http://127.0.0.1:8080/terms | grep --quiet '<strong>Reply STOP'
          curl --silent --fail http://127.0.0.1:8080/es/terms | grep --quiet 'lang="es"'
          curl --silent --fail --head http://127.0.0.1:8080/privacy | grep --ignore-case --quiet "^content-security-policy: default-src 'self'"
          curl --silent --fail --head http://127.0.0.1:8080/terms | grep --ignore-case --quiet "^content-security-policy: default-src 'self'"
          curl --silent --fail --head http://127.0.0.1:8080/ | grep --ignore-case --quiet '^x-frame-options: DENY'
          curl --silent --fail --head http://127.0.0.1:8080/ | grep --ignore-case --quiet '^cache-control: no-cache'
          curl --silent --fail --head http://127.0.0.1:8080/ | grep --ignore-case --quiet "^content-security-policy: default-src 'self'"
          curl --silent --fail --head http://127.0.0.1:8080/v1/meta | grep --ignore-case --quiet '^cache-control: no-store'
          # Never a redirect to //assets/, which a browser reads as another host.
          check '200' '%{http_code}' --path-as-is http://127.0.0.1:8080//assets
          asset="$(curl --silent --fail http://127.0.0.1:8080/ | grep --only-matching '/assets/[^"]*\.js' | head -1)"
          test -n "$asset"
          curl --silent --fail --head "http://127.0.0.1:8080$asset" | grep --ignore-case --quiet '^cache-control: public, max-age=31536000, immutable'
          # The image names the commit it was built from, in /v1/meta and in
          # every response's X-Yuppers-Version, and the web app it serves
          # was built with the same commit.
          meta="$(curl --silent --fail http://127.0.0.1:8080/v1/meta)"
          test "$(echo "$meta" | jq -r .commit)" = "$COMMIT" || { echo "::error::/v1/meta says $meta, not $COMMIT"; exit 1; }
          test "$(echo "$meta" | jq -r .built_at)" = "$BUILT_AT" || { echo "::error::/v1/meta says $meta, not built at $BUILT_AT"; exit 1; }
          curl --silent --fail --head http://127.0.0.1:8080/healthz | grep --ignore-case --quiet "^x-yuppers-version: ${COMMIT:0:7}"
          curl --silent --fail --head http://127.0.0.1:8080/ | grep --ignore-case --quiet "^x-yuppers-version: ${COMMIT:0:7}"
          # Read whole before searching, so grep stopping early cannot fail curl.
          scripts="$(for script in $(curl --silent --fail http://127.0.0.1:8080/ | grep --only-matching '/assets/[^"]*\.js'); do
            curl --silent --fail "http://127.0.0.1:8080$script"
          done)"
          grep --quiet "$COMMIT" <<< "$scripts" || { echo "::error::the web app was not built with $COMMIT"; exit 1; }
          # Every response names its request, and a plain request ID sent in
          # is the one returned.
          curl --silent --fail --head --header 'X-Request-Id: ci-smoke-1' http://127.0.0.1:8080/healthz | grep --ignore-case --quiet '^x-request-id: ci-smoke-1'
          # Metrics on their own port, counted by route template; never on
          # the public one, where /metrics is just another page of the app.
          curl --silent --fail http://127.0.0.1:9100/metrics | grep --quiet '^yuppers_http_requests_total{route="/healthz",method="GET",status="2xx"}'
          curl --silent --fail http://127.0.0.1:9100/metrics | grep --quiet '^yuppers_database_up 1'
          curl --silent --fail http://127.0.0.1:9100/metrics | grep --quiet "^yuppers_build_info{version=\"[0-9.]*\",commit=\"$COMMIT\"} 1"
          if curl --silent http://127.0.0.1:8080/metrics | grep --quiet yuppers_http_requests_total; then
            echo "::error::metrics are served on the public port"
            exit 1
          fi

      - name: Worker runs and stops cleanly on a signal
        run: |
          sleep 5
          docker compose --profile full logs worker | grep --quiet 'worker started'
          docker compose --profile full logs worker | grep --quiet "commit=\"${{ github.sha }}\""
          curl --silent --fail http://127.0.0.1:9101/metrics | grep --quiet '^yuppers_worker_runs_total{job="timers",result="ok"} [1-9]'
          docker compose --profile full stop --timeout 20 worker
          docker compose --profile full logs worker | grep --quiet 'worker shutting down'
          code="$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose --profile full ps --all --quiet worker)")"
          test "$code" = "0" || { echo "::error::the worker exited with $code"; exit 1; }

      - name: Logs
        if: ${{ failure() }}
        run: docker compose --profile full logs

  # The web app in a real browser, against the real API and a real database:
  # two people, each in a browser of their own, taking exchanges through
  # their lifecycle (apps/web/e2e). One-time codes are read from the API's
  # log, so no mail server is involved.
  e2e:
    name: End to end
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      DATABASE_URL: postgres://exchange_app:exchange_app@127.0.0.1:5432/yuppers
      MIGRATION_DATABASE_URL: postgres://exchange:exchange@127.0.0.1:5432/yuppers
      APP_SECRET: ci-only-secret-for-the-end-to-end-tests-0123456789
      # Where the API started below writes its log; the tests read codes from it.
      E2E_API_LOG: ${{ github.workspace }}/apps/web/e2e/.output/api.log
    services:
      postgres:
        # Pinned by digest, the same in every job and in the backup job's
        # PostgreSQL tools, and updated by hand: Dependabot does not read the
        # workflows' images (README, "Dependencies").
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f # 17
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: yuppers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U exchange -d yuppers"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Create the application role
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U exchange -d yuppers < docker/postgres-init.sql

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Build the backend
        working-directory: backend
        run: cargo build --locked --bin api --bin migrate --bin staff --bin worker

      # With a commit, so the update check below runs with the header the
      # deployed app sends (web/<version>+<commit>).
      - name: Build the web app
        env:
          GIT_SHA: ${{ github.sha }}
        run: npm run build:web

      - name: Apply the migrations
        run: backend/target/debug/migrate

      # The address and settings the tests expect (apps/web/e2e/support/env.ts).
      - name: Start the API
        env:
          BIND_ADDR: 127.0.0.1:8090
          WEB_ORIGIN: http://127.0.0.1:8090
          WEB_DIR: ${{ github.workspace }}/apps/web/dist
          CODE_DELIVERY: log
          NOTIFICATION_DELIVERY: log
          NO_COLOR: "1"
          # Every browser connects from 127.0.0.1, so the sign-in limit per
          # address is raised out of the way (signInLimits in env.ts).
          SIGN_IN_CODE_REQUESTS_PER_ADDRESS_PER_HOUR: "1000000"
          # Texts written to the log, so agreement updates are offered and
          # read back, and codes for phone numbers too (textMessages in
          # env.ts).
          SMS_DELIVERY: log
          SMS_CODE_DELIVERY: log
          SMS_MAX_PER_HOUR: "1000000"
          SMS_MAX_PER_PREFIX_PER_HOUR: "1000000"
        run: |
          mkdir -p "$(dirname "$E2E_API_LOG")"
          nohup backend/target/debug/api > "$E2E_API_LOG" 2>&1 &
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8090/readyz; then exit 0; fi
            sleep 1
          done
          cat "$E2E_API_LOG"
          echo "::error::the API did not become ready"
          exit 1

      - name: Run the tests
        run: npm run e2e -w @yuppers/web

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e/.output
          retention-days: 14

  # The mobile app's screens in Chromium the size of a phone, through the
  # browser harness: the app exported for Expo's web target, calling the real
  # API through the harness proxy, against a real database (apps/mobile/e2e).
  # It shows the screens and the flows; it is not a device run.
  e2e-mobile:
    name: Mobile end to end
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      DATABASE_URL: postgres://exchange_app:exchange_app@127.0.0.1:5432/yuppers
      MIGRATION_DATABASE_URL: postgres://exchange:exchange@127.0.0.1:5432/yuppers
      APP_SECRET: ci-only-secret-for-the-end-to-end-tests-0123456789
      # Where the API started below writes its log; the tests read codes from it.
      E2E_MOBILE_API_LOG: ${{ github.workspace }}/apps/mobile/e2e/.output/api.log
    services:
      postgres:
        # Pinned by digest, the same in every job and in the backup job's
        # PostgreSQL tools, and updated by hand: Dependabot does not read the
        # workflows' images (README, "Dependencies").
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f # 17
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: yuppers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U exchange -d yuppers"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Create the application role
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U exchange -d yuppers < docker/postgres-init.sql

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/mobile

      - name: Build the backend
        working-directory: backend
        run: cargo build --locked --bin api --bin migrate

      # With the harness proxy's address baked in (apps/mobile/e2e/support/export-web.mjs).
      - name: Export the app for the web
        run: npm run e2e:export -w @yuppers/mobile

      - name: Apply the migrations
        run: backend/target/debug/migrate

      # The address and settings the tests expect (apps/mobile/e2e/support/env.ts).
      # The tests start the harness proxy and the server for the export themselves.
      - name: Start the API
        env:
          BIND_ADDR: 127.0.0.1:8103
          WEB_ORIGIN: http://127.0.0.1:5203
          CODE_DELIVERY: log
          NOTIFICATION_DELIVERY: log
          NO_COLOR: "1"
          # Every request comes from 127.0.0.1; raise the per-address
          # sign-in limit out of the way.
          SIGN_IN_CODE_REQUESTS_PER_ADDRESS_PER_HOUR: "1000000"
        run: |
          mkdir -p "$(dirname "$E2E_MOBILE_API_LOG")"
          nohup backend/target/debug/api > "$E2E_MOBILE_API_LOG" 2>&1 &
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8103/readyz; then exit 0; fi
            sleep 1
          done
          cat "$E2E_MOBILE_API_LOG"
          echo "::error::the API did not become ready"
          exit 1

      - name: Run the tests
        run: npm run e2e -w @yuppers/mobile

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-playwright-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
            apps/mobile/e2e/.output/api.log
          retention-days: 14

  # An authoritative record that cannot be restored is not authoritative
  # (DESIGN.md §13.2). Fills a database through the API, backs it up with
  # scripts/backup.sh, restores it into a new database with
  # scripts/restore.sh, and proves the copy is the same: grants, triggers,
  # every table's rows, the schema test run against the copy, and a signed
  # agreement read back through the API with its hash intact
  # (docs/operations.md, "Backups"). Then deletes an account through the API
  # after the backup, restores that backup again, sees the account come back,
  # replays the deletion log of a newer backup, and proves the account is
  # deleted again with its identifiers free and its sessions gone
  # (docs/operations.md, "Restoring"). Along the way: the api and the worker
  # refuse to start on a copy until its deletion log is replayed, the replay
  # clears that mark, --no-replay-needed is recorded, and a grant the
  # migrations did not give fails the restore.
  backup:
    name: Backup and restore
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      SOURCE_URL: postgres://exchange:exchange@127.0.0.1:5432/yuppers
      SOURCE_APP_URL: postgres://exchange_app:exchange_app@127.0.0.1:5432/yuppers
      RESTORED_URL: postgres://exchange:exchange@127.0.0.1:5432/yuppers_restored
      RESTORED_APP_URL: postgres://exchange_app:exchange_app@127.0.0.1:5432/yuppers_restored
      REPLAYED_URL: postgres://exchange:exchange@127.0.0.1:5432/yuppers_replayed
      REPLAYED_APP_URL: postgres://exchange_app:exchange_app@127.0.0.1:5432/yuppers_replayed
      APP_SECRET: ci-only-secret-for-the-backup-check-0123456789
    services:
      postgres:
        # Pinned by digest, the same in every job and in the backup job's
        # PostgreSQL tools, and updated by hand: Dependabot does not read the
        # workflows' images (README, "Dependencies").
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f # 17
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: yuppers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U exchange -d yuppers"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      # For the load check, which makes the data through the API.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create the application role
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U exchange -d yuppers < docker/postgres-init.sql

      # The server's own major version of pg_dump, pg_restore and psql, from
      # the image the database runs, whatever the runner has installed.
      - name: PostgreSQL 17 tools
        run: |
          mkdir -p "$RUNNER_TEMP/pg17"
          for tool in pg_dump pg_restore psql; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host -v "%s:%s" -w "$PWD" postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f %s "$@"\n' \
              "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$tool" > "$RUNNER_TEMP/pg17/$tool"
            chmod +x "$RUNNER_TEMP/pg17/$tool"
          done
          echo "PG_BIN=$RUNNER_TEMP/pg17" >> "$GITHUB_ENV"
          echo "PSQL=$RUNNER_TEMP/pg17/psql" >> "$GITHUB_ENV"

      - name: Build the backend
        working-directory: backend
        run: cargo build --locked --bin api --bin worker --bin migrate --bin replay-deletions

      - name: Apply the migrations
        run: MIGRATION_DATABASE_URL="$SOURCE_URL" backend/target/debug/migrate

      # Ten pairs of people through a whole exchange: sign-in, a revision,
      # signatures, deliveries, an ending, notifications sent by the worker.
      - name: Make data through the API
        env:
          DATABASE_URL: ${{ env.SOURCE_APP_URL }}
          BIND_ADDR: 127.0.0.1:8090
          WEB_ORIGIN: http://127.0.0.1:8090
          CODE_DELIVERY: log
          NOTIFICATION_DELIVERY: log
          # Every person signs in from this one machine (README, "Load check").
          SIGN_IN_CODE_REQUESTS_PER_ADDRESS_PER_HOUR: "1000000"
          NO_COLOR: "1"
        run: |
          mkdir -p .backup
          backend/target/debug/api > .backup/api.log 2>&1 &
          echo $! > .backup/api.pid
          backend/target/debug/worker > .backup/worker.log 2>&1 &
          echo $! > .backup/worker.pid
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8090/readyz; then break; fi
            sleep 1
          done
          node scripts/load-check.mjs --pairs 10 --concurrency 5 --base-url http://127.0.0.1:8090 \
            --api-log .backup/api.log --database-url "$SOURCE_URL"
          # Nothing writes to the source from here on.
          kill -TERM "$(cat .backup/api.pid)" "$(cat .backup/worker.pid)"
          sleep 2

      - name: Back up
        run: |
          scripts/backup.sh -d "$SOURCE_URL" .backup/yuppers.dump
          # The deletion log beside it, readable by this user alone.
          test "$(stat -c %a .backup/yuppers.dump.deletions)" = 600
          head -n 1 .backup/yuppers.dump.deletions | grep --quiet '^# Yuppers deletion log'

      - name: An existing backup is not replaced without --force
        run: |
          before="$(cksum < .backup/yuppers.dump)"
          if scripts/backup.sh -d "$SOURCE_URL" .backup/yuppers.dump; then
            echo "::error::backup.sh replaced an existing backup without --force"
            exit 1
          fi
          [ "$(cksum < .backup/yuppers.dump)" = "$before" ]
          # Nor its deletion log, even where no backup has that name.
          cp .backup/yuppers.dump.deletions .backup/other.dump.deletions
          if scripts/backup.sh -d "$SOURCE_URL" .backup/other.dump; then
            echo "::error::backup.sh replaced an existing deletion log without --force"
            exit 1
          fi
          test ! -e .backup/other.dump
          rm .backup/other.dump.deletions
          scripts/backup.sh --force -d "$SOURCE_URL" .backup/yuppers.dump
          if ls -A .backup | grep --quiet partial; then
            echo "::error::backup.sh left a partial file behind"
            exit 1
          fi

      - name: A database that is not empty is refused
        run: |
          if scripts/restore.sh -d "$SOURCE_URL" .backup/yuppers.dump; then
            echo "::error::restore.sh restored over a database that holds tables"
            exit 1
          fi

      - name: Restore into a new database
        run: |
          "$PSQL" --no-psqlrc -v ON_ERROR_STOP=1 "$SOURCE_URL" -c "CREATE DATABASE yuppers_restored OWNER exchange"
          scripts/restore.sh -d "$RESTORED_URL" .backup/yuppers.dump

      - name: The copy matches the source
        run: scripts/check-restore.sh "$SOURCE_URL" "$RESTORED_URL"

      # Until the deletion log is replayed, the copy is marked, and neither
      # process starts on it (docs/operations.md, "Restoring").
      - name: The api and the worker refuse to start before the replay
        env:
          DATABASE_URL: ${{ env.RESTORED_APP_URL }}
          BIND_ADDR: 127.0.0.1:8091
          WEB_ORIGIN: http://127.0.0.1:8091
          CODE_DELIVERY: log
          NOTIFICATION_DELIVERY: log
          NO_COLOR: "1"
        run: |
          test "$("$PSQL" --no-psqlrc -At "$RESTORED_URL" -c "SELECT restore_replay_pending()")" = t
          for process in api worker; do
            if timeout 60 "backend/target/debug/$process" > ".backup/$process-refused.log" 2>&1; then
              echo "::error::the $process started on a copy waiting for its replay"
              exit 1
            fi
            grep --quiet "replay-deletions" ".backup/$process-refused.log"
          done

      - name: Restoring again over the copy, when told to, with no replay needed
        run: |
          scripts/restore.sh --overwrite --no-replay-needed -d "$RESTORED_URL" .backup/yuppers.dump
          scripts/check-restore.sh "$SOURCE_URL" "$RESTORED_URL"
          # The override is recorded, and the copy is no longer waiting.
          test "$("$PSQL" --no-psqlrc -At "$RESTORED_URL" -c "SELECT event FROM restore_marker ORDER BY id DESC LIMIT 1")" = REPLAY_NOT_NEEDED
          test "$("$PSQL" --no-psqlrc -At "$RESTORED_URL" -c "SELECT restore_replay_pending()")" = f

      # restore.sh checks the application role's grants and every trigger
      # against what the backup's migrations give (scripts/restore-inventory.txt).
      - name: A grant the migrations did not give fails the restore
        run: |
          "$PSQL" --no-psqlrc -v ON_ERROR_STOP=1 "$SOURCE_URL" -c "GRANT UPDATE ON revision TO exchange_app"
          scripts/backup.sh -d "$SOURCE_URL" .backup/tampered.dump
          "$PSQL" --no-psqlrc -v ON_ERROR_STOP=1 "$SOURCE_URL" -c "REVOKE UPDATE ON revision FROM exchange_app"
          "$PSQL" --no-psqlrc -v ON_ERROR_STOP=1 "$SOURCE_URL" -c "CREATE DATABASE yuppers_tampered OWNER exchange"
          if scripts/restore.sh -d postgres://exchange:exchange@127.0.0.1:5432/yuppers_tampered .backup/tampered.dump 2> .backup/tampered.err; then
            echo "::error::restore.sh accepted a grant the migrations did not give"
            exit 1
          fi
          grep --quiet '^+grant relation revision UPDATE' .backup/tampered.err
          "$PSQL" --no-psqlrc -v ON_ERROR_STOP=1 "$SOURCE_URL" -c "DROP DATABASE yuppers_tampered"
          rm .backup/tampered.dump .backup/tampered.dump.deletions

      # From here the source stands for the live database, and changes after
      # the backup: one person deletes their account through the API, with
      # codes read from the log, as they would from the app. Someone with a
      # live session, and not the initiator of the agreement that the record
      # check below reads back.
      - name: Delete an account through the API, after the backup
        env:
          DATABASE_URL: ${{ env.SOURCE_APP_URL }}
          BIND_ADDR: 127.0.0.1:8090
          WEB_ORIGIN: http://127.0.0.1:8090
          CODE_DELIVERY: log
          NOTIFICATION_DELIVERY: log
          # The load check's sign-ins came from this machine too.
          SIGN_IN_CODE_REQUESTS_PER_ADDRESS_PER_HOUR: "1000000"
          NO_COLOR: "1"
        run: |
          set -o pipefail
          read -r id email < <("$PSQL" --no-psqlrc -At -F ' ' -v ON_ERROR_STOP=1 "$SOURCE_URL" -c "
            SELECT a.id, a.email FROM account a
            WHERE a.status = 'ACTIVE' AND a.email IS NOT NULL
              AND EXISTS (SELECT 1 FROM account_session s WHERE s.account_id = a.id)
              AND a.id <> (SELECT created_by FROM exchange WHERE in_force_revision_id IS NOT NULL
                           ORDER BY created_at, id LIMIT 1)
            ORDER BY a.created_at DESC, a.id DESC LIMIT 1")
          test -n "$id"
          echo "DELETED_ID=$id" >> "$GITHUB_ENV"
          echo "DELETED_EMAIL=$email" >> "$GITHUB_ENV"
          backend/target/debug/api > .backup/api-delete.log 2>&1 &
          echo $! > .backup/api.pid
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8090/readyz; then break; fi
            sleep 1
          done
          code_for() {
            for _ in $(seq 1 20); do
              code=$(grep "one-time code" .backup/api-delete.log | grep -F "to=\"$email\"" \
                | grep -F "purpose=\"$1\"" | sed -E 's/.* code="([0-9]+)".*/\1/' | tail -n 1)
              if [ -n "$code" ]; then echo "$code"; return; fi
              sleep 0.5
            done
            echo "::error::no $1 code for $email in the log" >&2
            return 1
          }
          api() {
            curl --silent --show-error --fail-with-body -H 'x-client-version: web/0.0.0' \
              -H 'content-type: application/json' "$@"
          }
          base=http://127.0.0.1:8090/v1
          api -X POST "$base/auth/codes" -d "{\"identifier\":\"$email\"}"
          code=$(code_for sign-in)
          token=$(api -X POST "$base/auth/sessions" \
            -d "{\"identifier\":\"$email\",\"code\":\"$code\",\"delivery\":\"TOKEN\",\"language\":\"en\"}" \
            | jq -r .token)
          printf 'Authorization: Bearer %s\n' "$token" > .backup/authorization
          api -H @.backup/authorization -X POST "$base/me/deletion/codes" -d '{"channel":"EMAIL"}'
          code=$(code_for delete-account)
          api -H @.backup/authorization -X POST "$base/me/deletion" \
            -d "{\"channel\":\"EMAIL\",\"code\":\"$code\"}"
          rm .backup/authorization
          kill -TERM "$(cat .backup/api.pid)"
          sleep 2
          test "$("$PSQL" --no-psqlrc -At "$SOURCE_URL" -c "SELECT status FROM account WHERE id = '$id'")" = DELETED
          test "$("$PSQL" --no-psqlrc -At "$SOURCE_URL" -c "SELECT count(*) FROM deletion_log WHERE account_id = '$id'")" = 1

      # The newest backup's deletion log is what a restore of any older one
      # replays (docs/operations.md, "Restoring"). The live database's own
      # log, exported before restoring, says the same.
      - name: A newer backup, and the live deletion log
        run: |
          scripts/backup.sh -d "$SOURCE_URL" .backup/newer.dump
          scripts/export-deletions.sh -d "$SOURCE_URL" .backup/live.deletions
          grep --quiet "^$DELETED_ID	" .backup/newer.dump.deletions
          if grep --quiet "^$DELETED_ID	" .backup/yuppers.dump.deletions; then
            echo "::error::the earlier backup's log already holds the deletion"
            exit 1
          fi
          diff <(grep -v '^#' .backup/newer.dump.deletions) <(grep -v '^#' .backup/live.deletions)

      - name: Restoring the earlier backup brings the account back
        run: |
          "$PSQL" --no-psqlrc -v ON_ERROR_STOP=1 "$SOURCE_URL" -c "CREATE DATABASE yuppers_replayed OWNER exchange"
          scripts/restore.sh -d "$REPLAYED_URL" .backup/yuppers.dump
          read -r status has_email sessions < <("$PSQL" --no-psqlrc -At -F ' ' -v ON_ERROR_STOP=1 "$REPLAYED_URL" -c "
            SELECT status, email IS NOT NULL,
                   (SELECT count(*) FROM account_session WHERE account_id = a.id)
            FROM account a WHERE id = '$DELETED_ID'")
          echo "restored: $status, has an email: $has_email, $sessions sessions"
          test "$status" = ACTIVE
          test "$has_email" = t
          test "$sessions" -gt 0

      - name: Replaying the deletion log deletes it again
        run: |
          set -o pipefail
          test "$("$PSQL" --no-psqlrc -At "$REPLAYED_URL" -c "SELECT restore_replay_pending()")" = t
          scripts/replay-deletions.sh -d "$REPLAYED_APP_URL" .backup/newer.dump.deletions | tee .backup/replay.out
          grep --quiet "^$DELETED_ID: deleted again" .backup/replay.out
          # Every account in the log is deleted, so the mark is cleared and
          # the api can start on the copy (the record check below starts it).
          grep --quiet "no longer marked as waiting" .backup/replay.out
          test "$("$PSQL" --no-psqlrc -At "$REPLAYED_URL" -c "SELECT restore_replay_pending()")" = f
          test "$("$PSQL" --no-psqlrc -At "$REPLAYED_URL" -c "SELECT event || ' ' || by_role FROM restore_marker ORDER BY id DESC LIMIT 1")" = "REPLAYED exchange_app"
          read -r status email sessions devices holders < <(printf '%s\n' "
            SELECT status, coalesce(email, '-'),
                   (SELECT count(*) FROM account_session WHERE account_id = a.id),
                   (SELECT count(*) FROM device WHERE account_id = a.id),
                   (SELECT count(*) FROM account WHERE email = :'email')
            FROM account a WHERE id = :'id'" \
            | "$PSQL" --no-psqlrc -At -F ' ' -v ON_ERROR_STOP=1 -v id="$DELETED_ID" \
                -v email="$DELETED_EMAIL" "$REPLAYED_URL" -f -)
          echo "replayed: $status, email $email, $sessions sessions, $devices devices, $holders accounts with the address"
          test "$status" = DELETED
          test "$email" = -
          test "$sessions" = 0
          test "$devices" = 0
          test "$holders" = 0
          # The log keeps the time it first happened.
          logged="SELECT deleted_at FROM deletion_log WHERE account_id = '$DELETED_ID'"
          test "$("$PSQL" --no-psqlrc -At "$SOURCE_URL" -c "$logged")" = "$("$PSQL" --no-psqlrc -At "$REPLAYED_URL" -c "$logged")"
          # Again: nothing is left to do, and nothing is done.
          scripts/replay-deletions.sh -d "$REPLAYED_APP_URL" .backup/newer.dump.deletions | tee .backup/replay.out
          grep --quiet "^$DELETED_ID: already deleted" .backup/replay.out
          grep --quiet "^0 deleted again" .backup/replay.out

      # backend/tests/schema.rs against the copies: the application role can
      # record an agreement and cannot rewrite history, and nor can the
      # owner. Each test rolls back what it writes.
      - name: Schema test against the copy
        working-directory: backend
        env:
          MIGRATION_DATABASE_URL: ${{ env.RESTORED_URL }}
          DATABASE_URL: ${{ env.RESTORED_APP_URL }}
        run: cargo test --locked --test schema

      - name: Schema test against the replayed copy
        working-directory: backend
        env:
          MIGRATION_DATABASE_URL: ${{ env.REPLAYED_URL }}
          DATABASE_URL: ${{ env.REPLAYED_APP_URL }}
        run: cargo test --locked --test schema

      - name: A signed agreement reads back from the copy
        run: scripts/check-restored-record.sh "$RESTORED_URL" "$RESTORED_APP_URL" "$SOURCE_URL"

      - name: A signed agreement reads back from the replayed copy
        run: scripts/check-restored-record.sh "$REPLAYED_URL" "$REPLAYED_APP_URL" "$SOURCE_URL"

      - name: Logs
        if: ${{ failure() }}
        run: |
          tail -n 100 .backup/api.log .backup/worker.log .backup/api-delete.log || true
