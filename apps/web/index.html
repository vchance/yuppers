<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>{{title}}</title>
    <!--
      A template, not a page. `build/entry-pages.ts` fills the markers from the
      wording files and writes one copy per language, so an invitation link
      previews in the sender's language (DESIGN.md §4.2, §13.5), and a page per
      language for the privacy policy and for the terms, with the document
      written into #root (`build/legal-pages.ts`). Only those two are open to
      search engines.

      Link previews. Messaging apps fetch a shared link without verifying, so
      nothing here may ever name a person, a term or an amount.
    -->
    <meta name="description" content="{{description}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta name="robots" content="{{robots}}" />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
