# The local stack. Two ways to use it:
#
#   docker compose up -d                        the database alone, for running
#                                               the backend and web app from source
#   docker compose --profile full up --build    everything: database, migrations,
#                                               the API serving the web app at
#                                               http://localhost:8080, and the worker
#
# The connection strings match .env.example. Everything here is for a
# development machine: the roles' passwords are the well-known ones, codes and
# notifications go to the containers' logs, and the application secret is
# the development placeholder unless APP_SECRET is set in the environment or
# in `.env`. CONTACT_DATA_KEY has no default here: the full stack takes it
# from the environment or `.env`, and refuses to start without it. The
# published development key in .env.example does not do here: migrate
# refuses it for a database that is not on this machine, and this one is
# another container. Make one once and keep it in `.env` for as long as the
# volume lives (a new key cannot read what the old one sealed):
#
#   echo "CONTACT_DATA_KEY=$(openssl rand -base64 32)" >> .env
#
# (the last CONTACT_DATA_KEY line of `.env` is the one used). A real
# deployment sets each of these (README, "Deploying").

x-service: &service
  image: ${YUPPERS_IMAGE:-yuppers:local}
  build: .
  profiles: [full]

x-app-environment: &app-environment
  DATABASE_URL: postgres://exchange_app:exchange_app@postgres:5432/yuppers
  # Encrypts the email addresses and phone numbers stored (README, "Contact
  # details at rest"). From the environment or `.env`, never a default: the
  # processes refuse to start without it, and refuse the published
  # development keys (see the top of this file).
  CONTACT_DATA_KEY: ${CONTACT_DATA_KEY:-}
  WEB_ORIGIN: http://localhost:8080
  RUST_LOG: ${RUST_LOG:-info}
  LOG_FORMAT: ${LOG_FORMAT:-text}
  # Metrics on a port of their own inside each container, published below
  # on this machine only (docs/operations.md, "Metrics").
  METRICS_ADDR: 0.0.0.0:9100

services:
  postgres:
    image: mirror.gcr.io/library/postgres:17
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: yuppers
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Adds the restricted application role on first start.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP, which answers only once initialization has finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "exchange", "-d", "exchange"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs once, as the schema owner, and exits. The API and worker wait for it.
  migrate:
    <<: *service
    command: ["/usr/local/bin/migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgres://exchange:exchange@postgres:5432/yuppers
      CONTACT_DATA_KEY: ${CONTACT_DATA_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy

  # The API, serving the web app built into the image.
  api:
    <<: *service
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9100:9100"
    environment:
      <<: *app-environment
      APP_SECRET: ${APP_SECRET:-development-only-secret-do-not-use-anywhere-else}
      # Development delivery: one-time codes appear in `docker compose logs api`.
      CODE_DELIVERY: ${CODE_DELIVERY:-log}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *service
    command: ["/usr/local/bin/worker"]
    ports:
      - "127.0.0.1:9101:9100"
    environment:
      <<: *app-environment
      # Development delivery: notifications appear in `docker compose logs worker`.
      NOTIFICATION_DELIVERY: ${NOTIFICATION_DELIVERY:-log}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
