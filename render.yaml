# The Render Blueprint for Yuppers: the API (serving the web app), the
# worker, and a managed PostgreSQL 17 database, all in Render's US East
# region. docs/deploy-render.md is the owner's checklist; README, "Deploying",
# and .env.example say what each setting is.
#
# Spec: https://render.com/docs/blueprint-spec. CI checks this file against
# Render's published JSON schema, https://render.com/schema/render.yaml.json
# (the container job in .github/workflows/ci.yml).
#
# Nothing secret is in this file. Secrets are either generated by Render
# (`generateValue: true`: 256 random bits, base64) or asked for in the
# dashboard when the Blueprint is first applied (`sync: false`), and live only
# in Render.
#
# The two database roles (backend/migrations/README.md). Render creates one
# user, `exchange`, which owns the database and runs the migrations. Before
# migrating, `migrate` creates the restricted application role
# `exchange_app` with the generated APP_DB_PASSWORD, once
# (MIGRATE_CREATE_APP_ROLE, backend/src/app_role.rs). The api and the worker
# connect as `exchange_app`: they take the database's host, port and name
# from DATABASE_HOST, DATABASE_PORT and DATABASE_NAME, which carry no
# credentials, and sign in with APP_DB_PASSWORD (backend/src/config.rs,
# `database_url`). The owner's connection string, MIGRATION_DATABASE_URL, is
# still in each service's environment, because the pre-deploy `migrate` runs
# with its service's environment and Render offers no other place for it.

envVarGroups:
  # Plain settings, the same for the api and the worker.
  - name: yuppers-settings
    envVars:
      # The public origin. Cookie sessions are honored only from it, so sign
      # in on this address, not on the onrender.com one (docs/deploy-render.md).
      - key: WEB_ORIGIN
        value: https://yuppers.app
      - key: LOG_FORMAT
        value: json
      - key: RUST_LOG
        value: info
      # Every request reaches Render through Cloudflare, which writes the
      # caller's address into CF-Connecting-IP, overwriting whatever the
      # caller sent. X-Forwarded-For has several hops appended on the way, so
      # this is the header to trust (docs/deploy-render.md, "Client addresses").
      - key: TRUSTED_PROXY_HEADER
        value: CF-Connecting-IP
      - key: TRUSTED_PROXIES
        value: "1"
      # Email (codes and notifications) goes through Resend's HTTP API, with
      # RESEND_API_KEY from yuppers-secrets (docs/deploy-render.md, "Email").
      # `smtp` is the other option: any provider's SMTP server, below.
      - key: CODE_DELIVERY
        value: resend
      - key: NOTIFICATION_DELIVERY
        value: resend
      # The sender, on yuppers.app, which is verified in Resend. Used by
      # Resend and SMTP alike.
      - key: EMAIL_FROM
        value: Yuppers <no-reply@yuppers.app>
      # For the SMTP option only (CODE_DELIVERY or NOTIFICATION_DELIVERY
      # `smtp`); unused while both are `resend`. Any provider's SMTP server
      # works. These are Resend's own: STARTTLS on 587, username `resend`
      # and the API key as the password (SMTP_USERNAME and SMTP_PASSWORD in
      # yuppers-secrets).
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TLS
        value: starttls
      # The sender's older name, read only where EMAIL_FROM is unset. Kept
      # the same as EMAIL_FROM.
      - key: SMTP_FROM
        value: Yuppers <no-reply@yuppers.app>
      # Texting is on (docs/deploy-render.md, "Text messages"). Twilio
      # approved the A2P 10DLC campaign (use case STARTER) on 2026-10-08;
      # the two Verify services exist and their SIDs are in yuppers-secrets;
      # the inbound-message webhook is set on the Messaging Service. Both
      # settings below need SMS_ACCOUNT_SID, SMS_API_KEY_SID and
      # SMS_API_KEY_SECRET in yuppers-secrets: without them the api and the
      # worker refuse to start (the pre-deploy migrate does not read them),
      # so the deploy fails and the previous one keeps serving.
      #
      # Agreement updates by text ("Yuppers.app agreement updates"), through
      # Twilio's Messages API. It sends no codes.
      - key: SMS_DELIVERY
        value: twilio
      # The sender of agreement updates: the campaign's Messaging Service,
      # whose one number is +1 856 548 8780. An MG... SID is sent to Twilio
      # as MessagingServiceSid, a +1... number as From
      # (backend/src/notifications/sms.rs); the campaign is registered on
      # the service, so the service is the sender. Not a secret.
      - key: SMS_FROM
        value: MG5919e956a24e0e7a4cd2fa8037ef1457
      # One-time codes for phone numbers, made, sent and checked by Twilio
      # Verify, which needs no campaign (docs/deploy-render.md, "One-time
      # codes by Twilio Verify"). With it on, GET /v1/meta lists `phone` in
      # sign_in_channels and both apps offer signing in with a number; off,
      # CODE_DELIVERY sends email only.
      - key: SMS_CODE_DELIVERY
        value: verify
      - key: SMS_ALLOWED_COUNTRY_CODES
        value: "+1"
      # Of +1, the US alone (the 50 states and DC, by area code): never
      # Canada, the Caribbean, the US territories or toll-free numbers
      # (backend/src/nanp.rs). `US,CA` would add Canada. Twilio's geographic
      # permissions, Verify's included, are set to the US only to match.
      - key: SMS_ALLOWED_REGIONS
        value: US
      # The iOS app, for universal links (docs/mobile-release.md): the
      # Apple team ID and the bundle ID, served at
      # /.well-known/apple-app-site-association. Android's fingerprints
      # follow once the Play app exists.
      - key: APPLE_APP_ID
        value: 5VZ3GTX3T3.app.yuppers
      - key: PUSH_DELIVERY
        value: "off"
      # Traces, logs and metrics go to the owner's Grafana stack
      # (grafana/otel-lgtm) over OTLP/HTTP, through a Cloudflare Tunnel at
      # this name, with the Access service token in OTEL_EXPORTER_OTLP_HEADERS
      # from yuppers-secrets (docs/operations.md, "Telemetry"). A collector
      # that cannot be reached costs a warning every five minutes and
      # nothing else, so this stays set while the tunnel is being set up.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://otel.yuppers.app
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      # Wallet passes are off: none of their settings are given.

  # Secrets shared by the api and the worker.
  - name: yuppers-secrets
    envVars:
      # Resend's API key (re_...), with sending access restricted to the
      # yuppers.app domain. The api and the worker refuse to start without
      # it while CODE_DELIVERY or NOTIFICATION_DELIVERY is `resend`, so it
      # is entered by hand in the dashboard before the deploy that first
      # needs it (docs/deploy-render.md, "Email"). Never logged.
      - key: RESEND_API_KEY
        sync: false
      # For the SMTP option only: the SMTP server's username and password.
      # Unused while email goes by Resend's API. For Resend's SMTP server,
      # `resend` and the API key; for another provider, what it gives.
      # Entered in the dashboard.
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Twilio, for agreement updates (Messages API) and one-time codes
      # (Verify) alike (docs/deploy-render.md, "Text messages"): the account
      # SID (AC...) and a standard API key (SK...) with its secret. Needed
      # while SMS_DELIVERY or SMS_CODE_DELIVERY is on, as both are: the api
      # and the worker refuse to start without them. Render neither
      # prompts for a `sync: false` value in an environment group nor for one
      # added to a Blueprint already applied, so these are listed to say what
      # the group holds, and are entered by hand in the dashboard
      # (Environment Groups -> yuppers-secrets).
      - key: SMS_ACCOUNT_SID
        sync: false
      - key: SMS_API_KEY_SID
        sync: false
      - key: SMS_API_KEY_SECRET
        sync: false
      # The two Twilio Verify services (VA...): "Yuppers", for signing in
      # and confirming a number, and "Yuppers account deletion", for
      # deleting an account (Twilio refused the dot in "Yuppers.app"), so
      # that a code sent for one never works for the other and a deletion
      # code's text says what it is for ("Your Yuppers account deletion
      # verification code is: ..."). Needed while SMS_CODE_DELIVERY is
      # `verify`; entered by hand.
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_VERIFY_DELETION_SERVICE_SID
        sync: false
      # The account's auth token, which checks Twilio's signature on texts
      # people send back (STOP, START) at /v1/sms/inbound. Twilio signs with
      # it whatever the service sends with; nothing is sent with it. Without
      # it the api starts but warns, and refuses every STOP and START (403).
      - key: SMS_WEBHOOK_AUTH_TOKEN
        sync: false
      # The application role's password, generated once by Render. migrate
      # creates exchange_app with it; the api and the worker sign in with it.
      - key: APP_DB_PASSWORD
        generateValue: true
      # The key every email address and phone number in the database is
      # encrypted under (README, "Contact details at rest"): 32 random
      # bytes, `openssl rand -base64 32`, generated on the owner's machine
      # and entered by hand, never generated here, because a copy MUST be
      # kept outside Render: without it no address or number in the
      # database or its backups can ever be read again. migrate, the api and
      # the worker refuse to start without it, so it is entered before the
      # deploy that first needs it (docs/deploy-render.md, "Contact data
      # key"). CONTACT_DATA_KEY_PREVIOUS only while rotating
      # (docs/operations.md, "Contact data key"); empty otherwise.
      - key: CONTACT_DATA_KEY
        sync: false
      - key: CONTACT_DATA_KEY_PREVIOUS
        sync: false
      # The Cloudflare Access service token the telemetry collector's tunnel
      # asks for, as two headers:
      # CF-Access-Client-Id=...,CF-Access-Client-Secret=... (docs/operations.md,
      # "Telemetry"). Entered by hand in the dashboard; never logged. Without
      # it the collector answers 403, which is warned about and nothing more.
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

services:
  # The API, serving the web app from the same origin, and the
  # app-association files under /.well-known/.
  - type: web
    name: yuppers
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No dockerCommand: the image's CMD is the api.
    # Runs on a separate instance, before the new api starts. The image has
    # no shell, so this names the binary itself.
    preDeployCommand: /usr/local/bin/migrate
    healthCheckPath: /readyz
    # Deploy a commit to main only once CI has passed on it.
    autoDeployTrigger: checksPass
    domains:
      - yuppers.app
    envVars:
      - fromGroup: yuppers-settings
      - fromGroup: yuppers-secrets
      # The port Render sends public traffic to: the api's (the image's
      # BIND_ADDR), never a metrics port if METRICS_ADDR is ever set.
      - key: PORT
        value: "8080"
      # Keys the hashes of one-time codes; at least 32 bytes (Render's are 44
      # characters). Generated once; see docs/operations.md before rotating.
      - key: APP_SECRET
        generateValue: true
      # The owner's connection, for migrate (and the staff command). The api
      # never reads it.
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: yuppers-db
          property: connectionString
      - key: MIGRATE_CREATE_APP_ROLE
        value: "true"
      # Where the database is, with no credentials: the api signs in as
      # exchange_app with APP_DB_PASSWORD.
      - key: DATABASE_HOST
        fromDatabase:
          name: yuppers-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: yuppers-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: yuppers-db
          property: database

  # The worker: notifications, timers, reminders. One instance.
  - type: worker
    name: yuppers-worker
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /usr/local/bin/worker
    # The worker deploys on its own, at the same time as the api, so it
    # migrates too: the new worker never starts on the old schema. Two runs
    # at once are safe; the migrations take a lock and the role is created
    # once.
    preDeployCommand: /usr/local/bin/migrate
    # On SIGTERM it finishes the message it is sending, up to 30 seconds.
    maxShutdownDelaySeconds: 40
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: yuppers-settings
      - fromGroup: yuppers-secrets
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: yuppers-db
          property: connectionString
      - key: MIGRATE_CREATE_APP_ROLE
        value: "true"
      - key: DATABASE_HOST
        fromDatabase:
          name: yuppers-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: yuppers-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: yuppers-db
          property: database
      # The api's. While SMS_DELIVERY is on, the worker sends agreement
      # updates by text and counts them under the same hourly caps as the
      # api's codes, whose counts are keyed with it.
      - key: APP_SECRET
        fromService:
          type: web
          name: yuppers
          envVarKey: APP_SECRET

databases:
  - name: yuppers-db
    databaseName: yuppers
    # The schema owner. The name is free (the migrations name only
    # exchange_app); `exchange` matches the rest of the documentation.
    user: exchange
    region: virginia
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 5
    # Internal connections only. To reach it from your own machine (backups,
    # restores), add your address in the dashboard for the time it takes
    # (docs/deploy-render.md, "Reaching the database").
    ipAllowList: []
